<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e17"/>
      <stop offset="50%" stop-color="#07070b"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- K Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- K Upper Diagonal Gradient -->
    <linearGradient id="armUpGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- K Lower Diagonal Gradient -->
    <linearGradient id="armDownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="0" y="0" width="512" height="512" fill="url(#centerGlow)"/>

  <!-- Base Squircle Container with 1px Neon Border -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="120"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="8"
  />

  <!-- Subtle Inner Grid / Viewfinder Marks -->
  <path d="M72 120 L72 72 L120 72" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M440 120 L440 72 L392 72" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M72 392 L72 440 L120 440" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M440 392 L440 440 L392 440" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- REC / Live Indicator Dot -->
  <circle cx="396" cy="116" r="14" fill="#10b981"/>
  <circle cx="396" cy="116" r="22" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Stylized Monogram "K" with Video Play Chevron Elements -->
  <g filter="url(#glow)">
    <!-- Vertical Spine / Timeline Pillar of "K" -->
    <rect
      x="128"
      y="112"
      width="56"
      height="288"
      rx="28"
      fill="url(#stemGrad)"
    />

    <!-- Diagonal Upper Arm (Reaching towards top right with cut angle) -->
    <path
      d="M172 260 L310 136 C322 125 342 128 350 142 C358 156 354 174 340 186 L224 290 Z"
      fill="url(#armUpGrad)"
    />

    <!-- Diagonal Lower Arm / Forward Play Chevron of "K" -->
    <path
      d="M172 252 L340 366 C354 376 358 396 348 410 C338 424 318 426 306 416 L172 308 Z"
      fill="url(#armDownGrad)"
    />

    <!-- Overlapping Play Triangle Core Accent -->
    <polygon
      points="230,210 320,256 230,302"
      fill="#ffffff"
      opacity="0.9"
    />
  </g>
</svg>