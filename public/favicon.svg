<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151226" />
      <stop offset="100%" stop-color="#08070D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#8B5CF6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2.5" />

  <!-- Video Camera Body -->
  <rect x="14" y="19" width="22" height="26" rx="5.5" fill="#0D0C18" stroke="url(#brandGrad)" stroke-width="2" />

  <!-- Camera Lens -->
  <path d="M36 27.5L48 20V44L36 36.5V27.5Z" fill="url(#brandGrad)" />

  <!-- Precision Play Center -->
  <path d="M21 26.5L30 32L21 37.5V26.5Z" fill="#FFFFFF" filter="url(#glow)" />

  <!-- Active Recording Cyan Dot -->
  <circle cx="18.5" cy="23.5" r="1.8" fill="#06B6D4" />
</svg>